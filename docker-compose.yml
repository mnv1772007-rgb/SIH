version: '3.8'

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: sih-neo4j-graph
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt Port
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - ./scripts/init_neo4j.cypher:/var/lib/neo4j/import/init_neo4j.cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  graph-correlation-api:
    build: .
    container_name: sih-role4-graph-api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - API_KEY=dev-key
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  neo4j_data:
