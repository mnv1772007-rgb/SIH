[project]
name = "email-threat-ml"
version = "0.1.0"
description = "AI/ML Detection Engine for Email Threat Forensics"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "transformers>=4.36",
    "torch>=2.1",
    "sentence-transformers>=2.2",
    "fastapi>=0.105",
    "uvicorn>=0.25",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "mlflow>=2.9",
    "shap>=0.43",
    "textstat>=0.7",
    "tldextract>=5.0",
    "email-validator>=2.1",
    "faker>=20.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1", "black>=23.0", "mypy>=1.7"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]